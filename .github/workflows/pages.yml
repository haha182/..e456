name: Deploy Horizon Remade to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and exact game source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: horizon-remade/package-lock.json
      - name: Install locked dependencies
        working-directory: horizon-remade
        run: npm ci
      - name: Apply Harrison's game branding
        working-directory: horizon-remade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path("src/config.js")
          s = config.read_text()
          old = "export const FESTIVAL_NAME = 'Horizon Isla Festival';"
          new = "export const FESTIVAL_NAME = \"Harrison's Game\";"
          if old not in s:
              raise SystemExit("Expected festival name was not found; stopping build.")
          config.write_text(s.replace(old, new, 1))

          game = Path("src/game/game.js")
          s = game.read_text()
          old = """    if (!this.save.data.name) {
          const def = 'Driver' + Math.floor(1000 + Math.random() * 9000);
          this.menus.askName(def, (name) => {
            this.save.data.name = name;
            this.save.write(true);
            if (this.net.state === 'connected') this.net.rename(name);
            else if (this.settings.online) this.net.connect();
            this.enterFreeRoam(true);
          });
        } else this.enterFreeRoam();"""
          new = """    this.save.data.name = "Harrison";
        this.save.write(true);
        if (this.net.state === 'connected') this.net.rename("Harrison");
        else if (this.settings.online) this.net.connect();
        this.enterFreeRoam(!this.save.data.firstRun);"""
          if old not in s:
              raise SystemExit("Expected name-entry flow was not found; stopping build.")
          game.write_text(s.replace(old, new, 1))
          PY
      - name: Run upstream game tests
        working-directory: horizon-remade
        run: npm test
      - name: Build production website
        working-directory: horizon-remade
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built game
        uses: actions/upload-pages-artifact@v3
        with:
          path: horizon-remade/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
