name: Build and deploy Horizon Remade
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Checkout Horizon Remade source
        uses: actions/checkout@v4
        with:
          repository: Henry-fan88/horizon-remade
          ref: ec4ce49a8f781329d51ee14ea7fa8d4d2a42b5d4
          path: horizon-remade
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: horizon-remade/package-lock.json

      - name: Install locked dependencies
        working-directory: horizon-remade
        run: npm ci

      - name: Run upstream game tests
        working-directory: horizon-remade
        run: npm test

      - name: Build the game for the existing website URL
        working-directory: horizon-remade
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload this attempt's game artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: horizon-remade/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
