name: Deploy Horizon Remade to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and exact game source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: horizon-remade/package-lock.json
      - name: Install locked dependencies
        working-directory: horizon-remade
        run: npm ci
      - name: Customize welcome screen
        working-directory: horizon-remade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/ui/menus.js")
          s = p.read_text()
          old = "h('div', { class: 'dialog-kicker' }, `WELCOME TO THE ${FESTIVAL_NAME.toUpperCase()}`),"
          new = "h('div', { class: 'dialog-kicker' }, \"WELCOME TO HARRISON'S GAME\"),"
          if old not in s:
              raise SystemExit("Expected welcome screen text was not found; stopping build.")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run upstream game tests
        working-directory: horizon-remade
        run: npm test
      - name: Build production website
        working-directory: horizon-remade
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built game
        uses: actions/upload-pages-artifact@v3
        with:
          path: horizon-remade/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
