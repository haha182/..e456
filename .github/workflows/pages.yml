name: Deploy Horizon Remade to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and exact game source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: horizon-remade/package-lock.json
      - name: Install locked dependencies
        working-directory: horizon-remade
        run: npm ci
      - name: Apply Harrison branding and performance tuning
        working-directory: horizon-remade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path("src/config.js")
          s = config.read_text()
          replacements = [
              ("export const FESTIVAL_NAME = 'Horizon Isla Festival';", 'export const FESTIVAL_NAME = "Harrison\'s Game";'),
              ("  quality: 'auto', // auto | low | medium | high | ultra", "  quality: 'medium', // balanced preset for smoother play on Chromebook-class GPUs"),
              ("  motionBlur: true,", "  motionBlur: false,"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"Expected config text not found: {old}")
              s = s.replace(old, new, 1)
          config.write_text(s)

          game = Path("src/game/game.js")
          s = game.read_text()
          old = """    if (fps < 48 && s > 0.55) s = Math.max(0.55, s - 0.1);
              else if (fps > 57 && s < 1) s = Math.min(1, s + 0.05);"""
          new = """    if (fps < 55 && s > 0.5) s = Math.max(0.5, s - 0.15);
              else if (fps > 59 && s < 1) s = Math.min(1, s + 0.05);"""
          if old not in s:
              raise SystemExit("Expected dynamic-resolution thresholds were not found.")
          game.write_text(s.replace(old, new, 1))
          PY
      - name: Run upstream game tests
        working-directory: horizon-remade
        run: npm test
      - name: Build production website
        working-directory: horizon-remade
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built game
        uses: actions/upload-pages-artifact@v3
        with:
          path: horizon-remade/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
