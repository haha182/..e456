name: Ghost Driver checks
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
jobs:
  static-game-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify game entrypoint
        run: |
          test -s index.html
          grep -q 'GHOST DRIVER' index.html
          grep -q 'requestAnimationFrame' index.html
