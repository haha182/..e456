name: Game quality checks
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check rebuild/game.js
      - name: Check HTML and game wiring
        run: node scripts/qa.mjs
